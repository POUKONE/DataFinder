name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # .env.test est ignoré par git (il contient des secrets en local) ; on
      # le régénère ici avec juste SUPABASE_SCHEMA=test, les identifiants
      # Supabase venant des secrets du dépôt via env: ci-dessous. Ça isole
      # la suite de tests (schéma "test") du catalogue de production
      # (schéma "public") dans le même projet Supabase.
      - name: Prepare test env file
        run: echo "SUPABASE_SCHEMA=test" > .env.test

      - name: Build and test
        run: npm test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
